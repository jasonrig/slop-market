name: Validate marketplace

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Docs-derived conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Codex and Claude marketplace structure
        run: npm run validate

  codex-install-smoke:
    name: Codex install smoke
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install current Codex CLI
        run: npm install --global @openai/codex

      - name: Verify Codex can install marketplace plugins
        run: npm run validate:codex-install

  claude-native-smoke:
    name: Claude native smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install current Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Run best-effort native validation smoke tests
        run: npm run validate:native
